name: Build and processor tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify native Apple Silicon runner
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Processor and DSP tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Render benchmark (diagnostic, not an M5 certification)
        if: runner.os == 'macOS'
        run: build/AetherloomBenchmark_artefacts/Release/AetherloomBenchmark
      - name: Install and validate native AU
        if: runner.os == 'macOS'
        run: bash scripts/install-au.sh
      - name: Package component with bundle structure and executable permissions
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --keepParent build/Aetherloom_artefacts/Release/AU/Aetherloom.component build/Aetherloom-0.2.0-arm64.zip
          zip -j build/Aetherloom-0.2.0-arm64.zip scripts/install-au.sh
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: Aetherloom-0.2.0-Apple-Silicon-development
          path: build/Aetherloom-0.2.0-arm64.zip
